<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa de Satisfação</title>
</head>
<body>

    <h1>Pesquisa de Satisfação</h1>

    <form>

        <label for="nome">
            Nome:
        </label>
        <input type="text" 
        id="nome" 
        name="nome" 
        placeholder="Digite seu nome" 
        required>
        <br><br>

        <label for="email">
            E-mail:
        </label>
        <input type="email"
        id="email" 
        name="email" 
        placeholder="Digite seu e-mail" 
        required>
        <br><br>

        <label for="telefone">
            Telefone:
        </label>
        <input type="tel" 
        id="telefone" 
        name="telefone" 
        placeholder="Digite seu telefone" 
        required>
        <br><br>

        <h3>Avaliação Geral</h3>

        <input type="radio"
        id="otimo" 
        name="avaliacao" 
        value="otimo">
        <label for="otimo">Ótimo</label>
        <br>

        <input type="radio" 
        id="bom" 
        name="avaliacao" 
        value="bom">
        <label for="bom">Bom</label>
        <br>

        <input type="radio" 
        id="regular" 
        name="avaliacao" 
        value="regular">
        <label for="regular">Regular</label>
        <br>

        <input type="radio" 
        id="ruim" 
        name="avaliacao" 
        value="ruim">
        <label for="ruim">Ruim</label>

        <h3>Serviços Utilizados</h3>

        <input type="checkbox" 
        id="atendimento" 
        name="servicos" 
        value="atendimento">
        <label for="atendimento">Atendimento</label>
        <br>

        <input type="checkbox" 
        id="suporte" 
        name="servicos" 
        value="suporte">
        <label for="suporte">Suporte</label>
        <br>

        <input type="checkbox" 
        id="treinamento" 
        name="servicos" 
        value="treinamento">
        <label for="treinamento">Treinamento</label>
        <br>

        <input type="checkbox" 
        id="consultoria" 
        name="servicos" 
        value="consultoria">
        <label for="consultoria">Consultoria</label>

        <h3>Unidade Atendida</h3>

        <label for="unidade">Escolha a unidade:</label>
        <select id="unidade" name="unidade">
            <option value="">Selecione</option>
            <option value="sao-paulo">São Paulo</option>
            <option value="campinas">Campinas</option>
            <option value="santos">Santos</option>
            <option value="sorocaba">Sorocaba</option>
        </select>

        <br><br>

        <label for="comentario">Comentários:</label>
        <br>
        <textarea id="comentario" name="comentario" rows="5" cols="40"
            placeholder="Digite seus comentários"></textarea>

        <br><br>

        <button type="submit">Enviar Pesquisa</button>

    </form>

</body>
</html>
